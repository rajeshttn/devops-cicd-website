name: CI/CD Pipeline to AWS S3 and CloudFront

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node/Test placeholder (Test Stage)
      run: |
        echo "Running tests..."
        # Simple validation that index.html exists
        if [ -f "index.html" ]; then
          echo "Test Passed: index.html found."
        else
          echo "Test Failed: index.html missing!"
          exit 1
        fi

    - name: Build / Package Stage
      run: |
        echo "Building website package..."
        # Minification or bundling steps can go here if needed

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Deploy to Amazon S3
      run: |
        aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} --delete --exclude ".git/*" --exclude ".github/*"
